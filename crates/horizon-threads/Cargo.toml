[package]
name = "horizon-threads"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Scheduling hints for the game's threads and its allocator: the OS calls the crates that forbid unsafe code can't make"

[dependencies]
mimalloc = { version = "0.1.52", default-features = false, optional = true }
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"], optional = true }

[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
# Console runtimes already provide malloc/free and do not expose mmap.
system-allocator = []

[lints]
workspace = true
